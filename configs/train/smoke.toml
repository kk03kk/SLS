[run]
profile = "IRONCLAD_A0_ACT1"
seed = 0
device = "cpu"
workers = 1
updates = 1
save_interval = 1
evaluate_interval = 999
evaluation_seeds = [10000]
require_readiness = false
output = "runs/smoke"

[model]
embedding_dim = 32
transformer_layers = 1
attention_heads = 4
feedforward_dim = 64
dropout = 0.0

[ppo]
rollout_steps = 2
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
value_coefficient = 0.5
entropy_coefficient = 0.01
max_gradient_norm = 0.5
epochs = 1
minibatch_size = 2
potential_shaping = true
potential_scale = 0.2
reward_schema = "sls-act1-potential-v1"
episode_limit_schema = "sls-act1-episode-limit-v1"
max_episode_steps = 512
max_boundary_visits = 4
limit_failure_reward = -1.0
