[run]
workflow = "single-stage"
profile = "IRONCLAD_A20_ACT1"
seed = 90000000
training_seed_limit = 2000000000000
device = "cuda"
deterministic = true
worker_backend = "sharded-vector"
worker_layout = [64, 16]
benchmark = "local/runs/preparation/ironclad-a20-act1-v4-60m-stable/benchmark.json"
output = "local/runs/ironclad-a20-act1-v4-60m-stable"
selection_progress_guard = true
periodic_evaluation_seed_start = 6000000000000
periodic_evaluation_seed_count = 512
final_evaluation_seed_start = 7000000000000
final_evaluation_seed_count = 2048
evaluation_max_steps = 4096

[stages.train]
profile = "IRONCLAD_A20_ACT1"
target_environment_steps = 60000000
evaluate_every_steps = 1000000
checkpoint_every_steps = 250000
minimum_success_rate = 0.0
minimum_reached_act2_rate = 0.0
minimum_reached_act3_rate = 0.0
minimum_evaluation_episodes = 512
minimum_final_evaluation_episodes = 2048

[model]
embedding_dim = 128
transformer_layers = 4
attention_heads = 4
feedforward_dim = 256
recurrent_hidden_dim = 256
recurrent_layers = 1
dropout = 0.0
architecture = "sls-recurrent-relational-policy-v5"

[ppo]
rollout_steps = 256
recurrent_sequence_length = 64
minibatch_sequences = 16
learning_rate = 0.00003125
gamma = 1.0
gae_lambda = 0.98
clip_ratio = 0.2
value_coefficient = 0.5
entropy_coefficient = 0.002
entropy_final = 0.002
entropy_decay_steps = 4000000
entropy_schedule_start_steps = 46006272
target_kl = 0.02
final_kl_samples = 4096
value_clip_ratio = 0.2
max_gradient_norm = 0.5
epochs = 2
potential_shaping = true
potential_scale = 0.2
failure_progress_scale = 0.8
reward_schema = "sls-curriculum-progress-v3"
episode_limit_schema = "sls-fullrun-episode-limit-v2"
max_episode_steps = 4096
max_boundary_visits = 4
limit_failure_reward = -1.0

[warm_start]
checkpoint = "local/runs/ironclad-a20-act1-v1-50m/stages/train/selection/best_progress.pt"
checkpoint_sha256 = "2db39fde737445b109d31cc522dde42dfe2c7372b34007e108ce702b03acc70d"
parent_environment_steps = 46006272
transfer_kind = "optimization-experiment"
