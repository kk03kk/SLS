[run]
profile = "IRONCLAD_A0_ACT1"
seed = 0
device = "cuda"
workers = 32
worker_backend = "sharded-vector"
updates = 20
save_interval = 10
evaluate_interval = 10
evaluation_seed_start = 10000
evaluation_seed_count = 100
evaluation_max_steps = 512
output = "runs/act1-smoke-v3"

[model]
embedding_dim = 128
transformer_layers = 4
attention_heads = 4
feedforward_dim = 256
dropout = 0.0

[ppo]
rollout_steps = 128
learning_rate = 0.0003
gamma = 0.999
gae_lambda = 0.95
clip_ratio = 0.2
value_coefficient = 0.5
entropy_coefficient = 0.01
entropy_final = 0.001
entropy_decay_updates = 1000
target_kl = 0.015
value_clip_ratio = 0.2
max_gradient_norm = 0.5
epochs = 2
minibatch_size = 256
potential_shaping = true
potential_scale = 0.2
reward_schema = "sls-curriculum-potential-v2"
episode_limit_schema = "sls-act1-episode-limit-v1"
max_episode_steps = 512
max_boundary_visits = 4
limit_failure_reward = -1.0
