[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sls"
version = "0.1.0"
description = "Canonical FullRun Slay the Spire simulator and validation contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.6,<3"]
test = ["pytest==8.4.1"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sls*"]

[tool.setuptools.package-data]
"sls.content" = ["registry.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
