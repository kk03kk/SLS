[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sls"
version = "0.1.0"
description = "Slay the Spire simulator, recurrent PPO agent, and validation tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
model = ["torch>=2.6,<3", "numpy>=1.26,<3"]
test = ["pytest==8.4.1"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["sls*"]

[tool.setuptools.package-data]
"sls.content" = ["registry.json", "scope.json"]
"sls.model" = ["policy_vocabulary_v3.json", "policy_vocabulary_v4.json", "policy_vocabulary_v5.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "local/build/pytest-cache"
markers = [
    "local_evidence: requires privately supplied historical policy or stock decompilation evidence; absence is reported as a skip",
]

[tool.ruff]
cache-dir = "local/build/ruff-cache"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
