name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python tools/bootstrap.py --with-model --skip-tests
      - run: python -m ruff check .
      - run: python -m pytest -q
      # README requires this check and the vocabulary hash is bound into every
      # checkpoint, so drift must fail here rather than on a compute node.
      - run: python tools/generate_policy_vocabulary.py --check
      - run: python tools/generate_content_registry.py --check
      # Validate TOML plus registered experiment/compatibility JSON.
      - run: python tools/check_training_configs.py
      - run: python -m pip wheel . --no-deps -w wheelhouse
      - run: python -m pip install --force-reinstall --no-deps wheelhouse/*.whl
      - run: cd /tmp && python -c "from sls.model import policy_vocabulary; assert policy_vocabulary()['sha256']"

  native-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements/test.lock -r requirements/model.lock
      - run: python -m pip install -e . --no-deps
      - run: python tools/build_native.py --sanitizers
      # CPython is a C executable, so preload libstdc++ with ASan before a
      # dynamically loaded C++ extension can throw an exception.
      - run: LD_PRELOAD="$(c++ -print-file-name=libasan.so):$(c++ -print-file-name=libstdc++.so.6)" ASAN_OPTIONS=detect_leaks=0:abort_on_error=1 python -m pytest -vv -s tests/simulator tests/rl/test_training_smoke.py
